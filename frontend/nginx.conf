server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2g;

  # YouTube import (yt-dlp) can run for many minutes on a long/large video —
  # give this one endpoint a much longer read timeout than the default /api/.
  # Exact-match (=) wins over the /api/ prefix below.
  location = /api/files/from-youtube {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_buffering off; # stream NDJSON progress events to the client in real time
  }

  # Proxy API calls to the backend so the SPA can talk to it same-origin
  # (no CORS, and resilient to whatever VITE_API_BASE a cached bundle used).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    # Browser→nginx is same-origin; drop Origin on the backend hop so the API's
    # CORS allowlist doesn't reject access via a LAN IP / hostname.
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # stream large upload bodies (chunked parts)
    proxy_read_timeout 300s;
  }

  # WebSocket presence (I4) — upgrade /ws to the backend.
  location /ws {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # WebDAV (J3) — pass all DAV methods straight through to the backend.
  location /webdav {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # PWA: correct manifest mime + never cache the service worker (so updates ship).
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
