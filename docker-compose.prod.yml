# Production overrides — serve the app at https://rabbitworld.ddns.net behind
# Caddy (automatic HTTPS), with real-domain URLs and (optional) docker-mailserver.
#
# Web only:
#   JWT_SECRET=... docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# With real mail (docker-mailserver):
#   ... -f docker-compose.prod.yml --profile mail up -d
#
# Prereqs: DNS rabbitworld.ddns.net → your public IP; router forwards 80 + 443
# (and 25/587 if running mail). Set secrets in a .env file (see .env.prod.example).
services:
  caddy:
    image: caddy:2-alpine
    container_name: uploader-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # The dev mail catcher must not run in prod.
  mailpit:
    profiles: ['dev-only']

  # --- Datastores: real credentials, and NOT reachable from outside Docker. ---
  # The base compose publishes 5432/9000/9001 to the host for local development.
  # In prod only Caddy (80/443) may be exposed — Postgres and the MinIO console
  # must never be internet-facing. `ports: !override []` DROPS the inherited
  # mappings — a plain `ports: []` would be MERGED with the base list and keep
  # them published. Containers still reach each other over the compose network.
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in your .env}
    ports: !override []

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a strong MINIO_ROOT_PASSWORD in your .env}
    ports: !override []

  backend:
    # Reached through Caddy → frontend nginx → backend; no direct host port.
    ports: !override []
    environment:
      NODE_ENV: production
      # Forge-proof: refuse to start prod without a strong secret.
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT_SECRET in your .env}
      # Public, browser-reachable URLs (HTTPS via Caddy).
      MINIO_PUBLIC_ENDPOINT: https://rabbitworld.ddns.net
      CORS_ORIGIN: https://rabbitworld.ddns.net
      PUBLIC_BASE_URL: https://rabbitworld.ddns.net
      PUBLIC_APP_URL: https://rabbitworld.ddns.net
      # Email — defaults to docker-mailserver; override SMTP_* in .env for a relay.
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_ALLOW_SELFSIGNED: ${SMTP_ALLOW_SELFSIGNED:-false}
      SMTP_FROM: ${SMTP_FROM:-Uploader <no-reply@rabbitworld.ddns.net>}
      # Task5 #7 — Web Push. Override the base compose's DEV keypair: set your
      # own in .env (`npx web-push generate-vapid-keys`). Empty = push disabled
      # (safer than inheriting the committed dev key). Subject must be your URL.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@rabbitworld.ddns.net}

  # Caddy reaches nginx as `frontend:80` over the compose network. Publishing
  # 8080 as well would serve the whole app over plain HTTP, bypassing TLS.
  frontend:
    ports: !override []

  # Real outgoing mail (opt-in: add `--profile mail`). See docs/mail-setup.md.
  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: uploader-mailserver
    hostname: ${MAIL_HOSTNAME:-mail.rabbitworld.ddns.net}
    restart: unless-stopped
    profiles: ['mail']
    env_file:
      - ./mailserver.env
    ports:
      - '25:25'
      - '587:587'
      - '465:465'
      - '993:993'
    volumes:
      # Mail data/state/queue MUST be named volumes — docker-mailserver's postfix
      # queue needs real Linux filesystem semantics, which host bind mounts on
      # Docker Desktop (Windows/Mac) don't provide ("queue file write error").
      - dms-mail-data:/var/mail/
      - dms-mail-state:/var/mail-state/
      - dms-mail-logs:/var/log/mail/
      # Config (accounts, DKIM keys, user-patches.sh) stays a bind mount so it's
      # editable from the host and survives volume resets.
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
    cap_add:
      - NET_ADMIN

volumes:
  caddy-data:
  caddy-config:
  dms-mail-data:
  dms-mail-state:
  dms-mail-logs:
