services:
  postgres:
    image: postgres:16-alpine
    container_name: uploader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uploader
      POSTGRES_PASSWORD: uploader
      POSTGRES_DB: uploader
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uploader"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: uploader-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin@510
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev/self-hosted mail catcher: real SMTP on :1025, web UI on :8025. The app
  # sends reset/verify emails here; view them at http://<host>:8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: uploader-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP (optional external access)
    volumes:
      - mailpit-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uploader-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_PROVIDER: postgresql
      DATABASE_URL: postgresql://uploader:uploader@postgres:5432/uploader
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin@510
      MINIO_BUCKET: uploads
      MINIO_PUBLIC_ENDPOINT: http://192.168.2.99:9000
      JWT_SECRET: change-me-please-use-a-long-random-string
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      PUBLIC_BASE_URL: http://localhost:4000
      DEFAULT_QUOTA_BYTES: "5368709120"
      TRASH_RETENTION_DAYS: "30" # auto-purge trashed items older than N days (0 disables)
      # B9 — email (Mailpit). Point at a real relay (Gmail/SendGrid) for prod.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_FROM: "Uploader <no-reply@uploader.local>"
      PUBLIC_APP_URL: http://192.168.2.99:8080
    ports:
      - "4000:4000"
    volumes:
      - models-cache:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty → app calls /api same-origin, proxied to backend by nginx.
        # Avoids CORS and stale cross-origin base URLs in cached bundles.
        VITE_API_BASE: ""
    container_name: uploader-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mailpit-data:
  postgres-data:
  minio-data:
  models-cache:
